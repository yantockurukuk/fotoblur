<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd6e8">
<title>FotoblurBILOOO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <div id="tint"></div>
  <canvas id="fx"></canvas>
  <div id="status" class="pill">Memuat kamera…</div>
  <button id="swap" class="pill" hidden aria-label="Ganti kamera">🔄</button>
  <div id="hint" class="pill">Angkat 2 jari ✌️ untuk blur + love</div>
  <div id="notice">
    <p id="msg">Memuat kamera dan model tangan…</p>
    <button id="retry" hidden>Coba lagi</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
